; Chrome++ 配置覆盖层 / chrome++ configuration overlay
; 本文件中的配置会在打包时合并到上游最新的 chrome++.ini 中。
[general]
; 便携版数据与缓存目录
data_dir=%app%\..\Data
cache_dir=%app%\..\Cache

; 阻止从注册表读取 Chrome 企业版策略（用户要求默认开启）
ignore_policies=1

; Chrome 专属：LockProfileCookieDatabase 会独占 Cookie 数据库文件，
; 便携版多副本/多实例场景下会导致启动失败，故关闭。
command_line=--disable-features=LockProfileCookieDatabase
